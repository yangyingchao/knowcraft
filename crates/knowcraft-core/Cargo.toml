[package]
name = "knowcraft-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
getrandom = "0.2"
zip = "0.6"
tantivy = "0.22"
jieba-rs = "0.11"
notify = "6"
reqwest = { version = "0.12", features = ["blocking"] }
scraper = "0.20"
url = "2"
rustix = { version = "1.1", features = ["fs", "process"] }
pdfcraft-render = { path = "../vendor/pdfcraft/crates/render" }
pdfcraft-model = { path = "../vendor/pdfcraft/crates/model" }
pdfcraft-annot = { path = "../vendor/pdfcraft/crates/annot" }
pdfcraft-cos = { path = "../vendor/pdfcraft/crates/cos" }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "0.6"
url = "2"
tempfile = "3.27.0"
