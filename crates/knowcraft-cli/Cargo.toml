[package]
name = "knowcraft-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "knowcraft 命令行接口"

[[bin]]
name = "knowcraft-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
knowcraft-core = { path = "../knowcraft-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
